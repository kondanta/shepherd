[changelog]
header = "# Changelog\n\n"
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}

{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}\
 ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/kondanta/shepherd/commit/{{ commit.id }}))\
{% if commit.breaking %} ⚠ **BREAKING**{% endif %}

{% endfor %}
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance Improvements" },
  { message = "^revert", group = "Reverts" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styles" },
  { message = "^refactor", group = "Code Refactoring" },
  { message = "^chore: release", skip = true },
  { message = "^chore", group = "Miscellaneous Chores" },
  { message = "^test", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
]
filter_commits = true
tag_pattern = "\\d{4}\\.\\d+\\.\\d+"
sort_commits = "newest"
