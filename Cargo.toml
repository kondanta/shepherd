[package]
authors = ["Taylan Dogan <git@taylandogan.info>"]
name = "shepherd"
version = "2026.9.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["http2", "json", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
eyre = "0.6.14"
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = [
    "fs",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
    "std",
    "time",
    "tracing-log",
] }
arc-swap = "1.9.2"
walkdir = "2.5.0"
serde_yaml = "0.9.34"
dotenvy = "0.15.7"
which = "8.0.5"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
subtle = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# metrics facade is always present; without a recorder installed all calls are no-ops.
metrics = "0.24"

# opentelemetry_sdk is unconditional because SdkTracerProvider appears in the
# return type of init_tracing (which main.rs calls unconditionally for flush).
# Only the exporter and instrumentation crates are gated behind `otlp`.
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "trace"] }

# Optional — only compiled when the `otlp` feature is enabled.
opentelemetry = { version = "0.32.0", features = [
    "metrics",
    "trace",
], optional = true }
opentelemetry-otlp = { version = "0.32.0", features = [
    "metrics",
    "tonic",
    "trace",
    "logs",
    "grpc-tonic",
], optional = true }
opentelemetry-semantic-conventions = { version = "0.32.1", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
axum-prometheus = { version = "0.10.1", optional = true }
axum-tracing-opentelemetry = { version = "0.39.0", optional = true }


[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[features]
default = ["metrics"]

# Expose /metrics for Prometheus scraping. Lightweight: only axum-prometheus.
metrics = ["axum-prometheus"]

# Push traces to an OTel collector via OTLP/gRPC. Pulls in tonic + gRPC stack.
otlp = [
    "metrics",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry-semantic-conventions",
    "tracing-opentelemetry",
    "axum-tracing-opentelemetry",
]

[profile.release]
opt-level = 3
debug = false
panic = "abort"
lto = true
codegen-units = 1
