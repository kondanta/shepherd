[package]
authors = ["Taylan Dogan <git@taylandogan.info>"]
name = "shepherd"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["http2", "json", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
eyre = "0.6.12"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50", features = [
    "fs",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing = { version = "0.1.44", features = [
    "attributes",
    "release_max_level_info",
] }
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
    "fmt",
    "json",
    "std",
    "time",
    "tracing-log",
] }
arc-swap = "1.8.2"
walkdir = "2.5.0"
serde_yaml = "0.9.34"
dotenvy = "0.15.7"
which = "8.0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# opentelemetry_sdk is unconditional because SdkTracerProvider appears in the
# return type of init_tracing (which main.rs calls unconditionally for flush).
# Only the exporter and instrumentation crates are gated behind `otlp`.
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "trace"] }

# Optional — only compiled when the `otlp` feature is enabled.
opentelemetry = { version = "0.31.0", features = ["metrics", "trace"], optional = true }
opentelemetry-otlp = { version = "0.31.0", features = [
    "metrics",
    "tonic",
    "trace",
    "logs",
    "grpc-tonic",
], optional = true }
opentelemetry-semantic-conventions = { version = "0.31.0", optional = true }
tracing-opentelemetry = { version = "0.32.1", optional = true }
axum-prometheus = { version = "0.10.0", optional = true }
axum-tracing-opentelemetry = { version = "0.33.0", optional = true }

[dev-dependencies]
tempfile = "=3.26.0"

[features]
default = []

otlp = [
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry-semantic-conventions",
    "tracing-opentelemetry",
    "axum-prometheus",
    "axum-tracing-opentelemetry",
]

[profile.release]
opt-level = 3
debug = false
panic = "abort"
lto = true
codegen-units = 1
