# Example docker-compose.yml for running shepherd itself.
# Copy this file, fill in the environment variables, and adjust the volume
# paths before use.
#
# ── Docker socket ─────────────────────────────────────────────────────────────
# Shepherd drives docker by running `docker` and `docker compose` commands.
# Mounting /var/run/docker.sock gives the container access to the host daemon.
# This is equivalent to root access on the host — keep shepherd's port and
# API_TOKEN out of public networks.
#
# ── Volume paths ──────────────────────────────────────────────────────────────
# Mount ROOT_DIR at the SAME path as on the host. Shepherd passes compose file
# paths to `docker compose`, which the daemon resolves against the HOST
# filesystem. If the path inside the container differs from the host path,
# volume declarations inside your compose files will point to wrong locations.
#
#   Good:  host /opt/services  → container /opt/services  (paths match)
#   Bad:   host /opt/services  → container /data          (paths differ)

services:
  shepherd:
    image: ghcr.io/your-org/shepherd:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Required: docker socket — see note above.
      - /var/run/docker.sock:/var/run/docker.sock
      # Required: your compose files directory.
      # Mount at the same absolute path as on the host.
      - /opt/services:/opt/services
    environment:
      # Required: directory shepherd scans for compose files.
      ROOT_DIR: /opt/services

      # Required: shared secret for GitHub webhook verification.
      # Set the same value in your GitHub repository → Settings → Webhooks.
      WEBHOOK_SECRET: "change-me"

      # Recommended: GitHub token to avoid rate limits when fetching
      # compose files at the commit SHA. A fine-grained token with
      # read-only contents access to the target repository is sufficient.
      # GITHUB_TOKEN: "ghp_..."

      # Optional: bearer token protecting the /flags/* endpoints.
      # If unset, those endpoints return 401.
      # API_TOKEN: "change-me"

      # Optional: Renovate bot identity (defaults shown).
      # Override if you run a self-hosted Renovate with a custom identity.
      # RENOVATE_USERNAME: "renovate[bot]"
      # RENOVATE_EMAIL: "renovate[bot]@users.noreply.github.com"

      # Optional: allow services using the 'latest' tag to be deployed.
      # Defaults to false (latest tag is rejected as unsafe).
      # ALLOW_LATEST_IMAGES: "false"

      # Optional: log level (trace, debug, info, warn, error). Default: info.
      # LOG_LEVEL: "info"
