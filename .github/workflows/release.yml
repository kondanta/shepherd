name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Static binary build ──────────────────────────────────────────────────────
  # Each architecture builds natively — no QEMU, no cross-compilation.
  # The produced binaries are fully static (musl) and have no runtime
  # dependencies other than the Linux kernel.
  build-binary:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: shepherd-linux-amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            artifact: shepherd-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --features metrics --target ${{ matrix.target }}
        env:
          # Ensure the C runtime is linked statically so the binary
          # runs on any Linux distribution without glibc installed.
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Stage artifact
        run: |
          cp target/${{ matrix.target }}/release/shepherd ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            shepherd-linux-amd64
            shepherd-linux-arm64

  # ── Docker image ─────────────────────────────────────────────────────────────
  # Downloads the pre-built binaries from the binary job and injects them into
  # the Docker image — no compilation happens here. QEMU is registered only to
  # satisfy buildx's platform awareness; the actual work per platform is just
  # a COPY of the right binary, which runs natively on the builder.
  build-docker:
    name: Docker image
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Mark binaries executable
        run: chmod +x shepherd-linux-amd64 shepherd-linux-arm64

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
