name: Release

on:
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Static binary build ──────────────────────────────────────────────────────
  # amd64 and arm64 build natively on GitHub-hosted runners (no QEMU, no cross).
  # armv7 cross-compiles on ubuntu-latest using the `cross` tool (Docker-based).
  # All binaries are fully static musl with no runtime dependencies.
  build-binary:
    name: Binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: shepherd-linux-amd64
            cross: false
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            artifact: shepherd-linux-arm64
            cross: false
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            artifact: shepherd-linux-armv7
            cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (native builds)
        if: ${{ !matrix.cross }}
        run: sudo apt-get install -y musl-tools

      - name: Install cross (armv7)
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --features metrics --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --features metrics --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          cp target/${{ matrix.target }}/release/shepherd ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            shepherd-linux-amd64
            shepherd-linux-arm64
            shepherd-linux-armv7

  # ── Docker image ─────────────────────────────────────────────────────────────
  # Downloads the pre-built binaries and injects them into the image — no
  # compilation here. QEMU is registered only to satisfy buildx's platform
  # awareness; each platform just COPYs the right pre-built binary.
  build-docker:
    name: Docker image
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Mark binaries executable
        run: chmod +x shepherd-linux-amd64 shepherd-linux-arm64 shepherd-linux-armv7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
